global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "match-ats"
    static_configs:
      - targets: ["localhost:3000"]
    metrics_path: /metrics

  - job_name: "supabase"
    static_configs:
      - targets: ["supabase:9090"]
