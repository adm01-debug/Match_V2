apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: match-ats-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: match-ats.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: match-ats-service
            port:
              number: 80
  tls:
  - hosts:
    - match-ats.example.com
    secretName: match-ats-tls
