# docs:
#   gatilho: push em main que toque codigo, banco, os scripts das automacoes ou docs/contexto/regras/manual/; 1x por dia (09:41 UTC); dispatch
#   prova: branch contexto com docs/contexto/{codigo,regras}/ regerados das duas fontes (codigo em main; codigo+migrations+manual/) e docs/contexto/00-INDEX.md montado a partir dos manifests
#   falha: falha fatal de produtor reprova o workflow; a fonte que publicou artefato entra e a outra mantem a ultima versao
#   avisa: ninguem (a branch contexto e a prova; erros_do_gerador em codigo/ lista secoes com falha)
# nao-e-bug:
#   - sem-commit: "nada mudou" no publicar significa que nenhuma das duas fontes mudou desde a ultima publicacao
#   - sem-banco-ao-vivo: o estado real do banco NAO sai aqui — vem do inventario-estado-semanal.yml (Management API)
name: Contexto para agentes de IA

# UM workflow, DOIS produtores independentes (um job cada), UM indice, UMA branch:
# falha fatal deixa o workflow vermelho; publicar ainda reune as fontes disponiveis via !cancelled().
#
#   codigo/   ← scripts/ai-context/gerar.mjs      (rotas, modulos, hooks, edges, grafo, testes, convencoes, baseline)
#   regras/   ← scripts/regras_negocio/           (RLS por operacao, estados, validacoes, formulas, lacunas, manual/)
#   00-INDEX.md ← scripts/regras_negocio/indice.py (le o manifest.json de cada pasta; diz quem e dono de cada fato)
#
# Cada fato tem um dono: onde fica o codigo = codigo/; o que pode/nao pode = regras/; schema e estado
# REAL do banco = inventario/estado/banco.json, refeito pelo inventario-estado-semanal.yml.
# Onde fica: branch `contexto` (gerada, com historico; nunca abra PR dela). Push com GITHUB_TOKEN nao
# dispara outros workflows (anti-loop) e os workflows deste repo sao todos filtrados por `main`.
# Como ler: git fetch origin contexto && git show origin/contexto:docs/contexto/00-INDEX.md, ou MCP
# get_file(ref=contexto), ou raw.githubusercontent.com/<owner>/<repo>/contexto/docs/contexto/00-INDEX.md.
#
# Diferenca proposital do Zapp_Web_V2 (de onde estes scripts vieram): la o agendamento e a cada 10 min
# porque um terceiro produtor coleta o banco ao vivo (muda sem push). Aqui as duas fontes so mudam com
# push em main — que ja e gatilho —, e este repo e privado (minuto de Actions e cobrado): o agendamento
# diario e so rede de seguranca.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'scripts/ai-context/**'
      - 'scripts/regras_negocio/**'
      - 'docs/contexto/regras/manual/**'
      - 'package.json'
      - 'tsconfig*.json'
      - '.env.example'
      - '.github/workflows/**'
  schedule:
    - cron: '41 9 * * *' # 09:41 UTC — fora do minuto 0 (fila do GitHub) e dos outros crons do repo
  workflow_dispatch:
    inputs:
      graphify:
        description: 'Rodar graphify (grafo por AST) no job de codigo'
        type: boolean
        default: true
      force:
        description: 'Regenerar tudo ignorando o estado anterior da branch'
        type: boolean
        default: false

concurrency:
  group: contexto
  cancel-in-progress: false # push em main nunca e cancelado; o gate por commit evita trabalho repetido

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CONTEXTO_BRANCH: contexto
  CONTEXTO_DIR: docs/contexto

jobs:
  gate:
    name: O que precisa rodar
    # O dispatch nao deve executar codigo de uma ref arbitraria com token de escrita.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codigo: ${{ steps.g.outputs.codigo }}
      regras: ${{ steps.g.outputs.regras }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Comparar HEAD de main com os manifests da branch contexto
        id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          head="$(git rev-parse HEAD)"
          last_codigo=""; last_regras=""
          if git fetch -q --depth=1 origin "$CONTEXTO_BRANCH" 2>/dev/null; then
            last_codigo="$(git show "FETCH_HEAD:$CONTEXTO_DIR/codigo/manifest.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")"
            last_regras="$(git show "FETCH_HEAD:$CONTEXTO_DIR/regras/manifest.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")"
          fi
          codigo=true; regras=true
          if [ "$EVENT_NAME" = "schedule" ] && [ "$FORCE" != "true" ]; then
            [ "$head" = "$last_codigo" ] && codigo=false
            [ "$head" = "$last_regras" ] && regras=false
          fi
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "regras=$regras" >> "$GITHUB_OUTPUT"
          echo "head=$head codigo=$codigo (ultimo $last_codigo) regras=$regras (ultimo $last_regras)"

  codigo:
    name: Produtor codigo/ (gerar.mjs)
    needs: gate
    if: needs.gate.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 300 # baseline.json usa git log dos ultimos 90 dias

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Testar o gerador e os inventarios (sem dependencia instalada)
        run: |
          node --test scripts/ai-context/gerar.unit.mjs
          node --test scripts/ci/inventario-rotas.unit.mjs
          node --test scripts/ci/inventario-banco.unit.mjs
          node --test scripts/ci/inventario-mudou.unit.mjs
          node --test scripts/ci/inventario-repo.unit.mjs

      - name: Cache do graphify (AST ja extraida)
        if: github.event_name != 'workflow_dispatch' || inputs.graphify
        uses: actions/cache@v6
        with:
          path: graphify-out/cache
          key: graphify-cache-${{ github.sha }}
          restore-keys: |
            graphify-cache-

      - name: Grafo de codigo (graphify, opcional)
        if: github.event_name != 'workflow_dispatch' || inputs.graphify
        continue-on-error: true # grafo e extra: se falhar, o inventario sai sem ele
        env:
          GRAPHIFY_VERSION: '0.9.68'
        run: |
          if ! command -v uvx >/dev/null 2>&1; then pip install --quiet --user uv && export PATH="$HOME/.local/bin:$PATH"; fi
          uvx --from "graphifyy[sql]==${GRAPHIFY_VERSION}" graphify update . --force
          rm -f graphify-out/graph.html

      - name: Gerar codigo/
        run: |
          node scripts/ai-context/gerar.mjs --out "$CONTEXTO_DIR/codigo"
          if [ -f graphify-out/GRAPH_REPORT.md ]; then cp graphify-out/GRAPH_REPORT.md "$CONTEXTO_DIR/codigo/GRAPH_REPORT.md"; fi
          ls "$CONTEXTO_DIR/codigo"

      - name: Guardar para o publicar
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: contexto-codigo
          path: docs/contexto/codigo
          if-no-files-found: error
          retention-days: 1

  regras:
    name: Produtor regras/ (generate.py)
    needs: gate
    if: needs.gate.outputs.regras == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 60 # o ultimo commit nao-bot vira o `commit` do manifest

      - name: Testar o gerador (stdlib, sem dependencia)
        run: python3 scripts/regras_negocio/test_generate.py

      - name: Gerar regras/
        run: |
          python3 scripts/regras_negocio/generate.py --repo . --out "$CONTEXTO_DIR/regras" \
            --profile regras --index-path "$CONTEXTO_DIR/00-INDEX.md" --no-pointer
          ls "$CONTEXTO_DIR/regras"

      - name: Guardar para o publicar
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: contexto-regras
          path: docs/contexto/regras
          if-no-files-found: error
          retention-days: 1

  publicar:
    name: Indice unico + branch contexto
    needs: [gate, codigo, regras]
    # roda mesmo com produtor pulado ou vermelho: publica o que saiu e mantem o resto como estava
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push na branch gerada contexto
    steps:
      - name: Checkout (main — indice.py e manual/ vem daqui)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Baixar codigo/
        if: needs.codigo.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.codigo.outputs.artifact-id }}
          path: ${{ runner.temp }}/art/contexto-codigo

      - name: Baixar regras/
        if: needs.regras.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.regras.outputs.artifact-id }}
          path: ${{ runner.temp }}/art/contexto-regras

      - name: Montar a branch e publicar (so se algo mudou)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MAIN: ${{ github.sha }}
          HUSKY: '0'
        run: |
          ART="$RUNNER_TEMP/art"
          PUB="$RUNNER_TEMP/pub"
          git worktree remove --force "$PUB" 2>/dev/null || true
          rm -rf "$PUB"; git worktree prune
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --quiet --depth 1 origin "$CONTEXTO_BRANCH" 2>/dev/null; then
            git worktree add --quiet --detach "$PUB" FETCH_HEAD
            ( cd "$PUB" && git checkout --quiet -B "$CONTEXTO_BRANCH" )
          else
            mkdir -p "$PUB"
            ( cd "$PUB" && git init --quiet -b "$CONTEXTO_BRANCH" )
          fi
          mkdir -p "$PUB/$CONTEXTO_DIR"
          novos=0
          for fonte in codigo regras; do
            if [ -d "$ART/contexto-$fonte" ]; then
              rm -rf "${PUB:?}/$CONTEXTO_DIR/$fonte"
              cp -a "$ART/contexto-$fonte" "$PUB/$CONTEXTO_DIR/$fonte"
              novos=$((novos + 1))
            else
              echo "$fonte/: sem artefato neste run — mantem o que esta na branch"
            fi
          done
          # manual/ e texto humano e vive em main: a copia na branch segue a main
          if [ -d "$CONTEXTO_DIR/regras/manual" ]; then
            rm -rf "$PUB/$CONTEXTO_DIR/regras/manual"; mkdir -p "$PUB/$CONTEXTO_DIR/regras"
            cp -a "$CONTEXTO_DIR/regras/manual" "$PUB/$CONTEXTO_DIR/regras/manual"
          fi
          python3 scripts/regras_negocio/indice.py --repo "$PUB" --out "$CONTEXTO_DIR/00-INDEX.md" --head "$HEAD_MAIN" \
            --remote "$GITHUB_REPOSITORY" \
            --fonte "código=$CONTEXTO_DIR/codigo" \
            --fonte "regras de negócio=$CONTEXTO_DIR/regras"
          cat > "$PUB/README.md" <<'EOF'
          # Branch gerada: contexto para agentes de IA

          Comece por `docs/contexto/00-INDEX.md`. As pastas `codigo/` e `regras/` sao regeradas pelo
          workflow `contexto.yml` da main — nao edite nem abra PR desta branch. Regras humanas vivem em
          `docs/contexto/regras/manual/` na **main**. O estado real do banco nao esta aqui: ele fica em
          `inventario/estado/banco.json` na main (workflow `inventario-estado-semanal.yml`).
          EOF
          # Sem isto a Vercel faria um preview deploy a cada publicacao nesta branch (a integracao
          # git da Vercel esta ativa neste repo — ela comenta nas PRs; a Vercel le o vercel.json do
          # commit deployado, por isso o arquivo vive na branch gerada, nao na main).
          cat > "$PUB/vercel.json" <<'EOF'
          { "ignoreCommand": "exit 0", "git": { "deploymentEnabled": { "contexto": false } } }
          EOF
          cd "$PUB"
          git config user.name 'contexto[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo "nada mudou em nenhuma das fontes."; exit 0; fi
          git commit --quiet -m "chore(contexto): $novos fonte(s) regerada(s) @ main ${HEAD_MAIN:0:7} [skip ci]"
          git push --quiet "$REMOTE" "HEAD:refs/heads/$CONTEXTO_BRANCH"
          echo "Publicado em $CONTEXTO_BRANCH: $(git rev-parse --short HEAD) (fontes novas: $novos)"
