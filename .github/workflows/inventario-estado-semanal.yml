# docs:
#   gatilho: agendado (seg 10:23 UTC) e dispatch
#   prova: inventario/estado (banco, rotas, edges) regerado do banco oficial e do codigo
#   falha: o job fica vermelho e o inventario nao e atualizado
#   avisa: PR automation/inventario-estado com o inventario novo
# nao-e-bug:
#   - sem-banco: sem o secret SUPABASE_ACCESS_TOKEN o passo do banco sai verde com aviso e banco.json fica como estava
name: Inventário do estado real (semanal)

# Refaz inventario/estado/ (banco, edge functions, rotas do front) a partir do banco oficial
# (somente leitura, Management API) e do código, e abre PR se algo mudou.
# Scripts: scripts/inventario/gerar-banco.mjs, gerar-rotas.mjs e gerar-repo.mjs.
# Nunca faz push direto em main — entrega via PR na branch automation/inventario-estado.
#
# Por que Management API e não psql: db.syinhicmyrsdeaeyayjs.supabase.co resolve só IPv6 e o pooler
# Supabase Cloud não serve este tenant (ver .github/workflows/install-mcp-exec.yml e docs/agentes/banco.md).
# POST /database/query/read-only roda a consulta numa transação somente leitura, por HTTPS.
#
# Secrets:
#   - SUPABASE_ACCESS_TOKEN (personal access token da Management API; só leitura aqui:
#     POST /database/query/read-only e GET /functions do projeto syinhicmyrsdeaeyayjs).
#     Enquanto o secret não existir, o inventário do banco é pulado com aviso e o das rotas/edges
#     (que só lê o repo) continua rodando.

on:
  schedule:
    - cron: '23 10 * * 1' # segunda 10:23 UTC (07:23 BRT), fora do minuto 0
  workflow_dispatch:

concurrency:
  group: inventario-estado-semanal
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  gerar:
    name: Refazer inventario/estado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # branch do PR
      pull-requests: write # abrir/atualizar o PR
      actions: write # liberar os checks do PR aberto com GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Instalar ripgrep (usado pelo gerar-repo.mjs)
        run: command -v rg || sudo apt-get install -y --no-install-recommends ripgrep

      - name: Testar os geradores (sem dependencia instalada)
        run: |
          node --test scripts/ci/inventario-banco.unit.mjs
          node --test scripts/ci/inventario-rotas.unit.mjs
          node --test scripts/ci/inventario-mudou.unit.mjs
          node --test scripts/ci/inventario-repo.unit.mjs

      - name: Inventário do banco (somente leitura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            # Sem o secret não há o que ler. Sai verde com aviso para o inventário de rotas/edges
            # (que só depende do repo) continuar entregando; banco.json fica como está na main.
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN ausente — inventário do banco pulado (ver o cabeçalho deste workflow)"
            exit 0
          fi
          node scripts/inventario/gerar-banco.mjs

      - name: Inventário do repositório (rotas e edge functions)
        run: |
          node scripts/inventario/gerar-rotas.mjs
          # < /dev/null: sem lista de tabelas no stdin o script so grava edges.json
          node scripts/inventario/gerar-repo.mjs < /dev/null

      - name: Decidir se vale PR
        id: mudou
        # Compara o JSON sem os carimbos de data (medido_em/gerado_em) e sem a telemetria viva do
        # cron, arquivo a arquivo contra o HEAD. Filtrar linhas do diff não serve: o edges.json é
        # gravado numa linha só, com a data.
        run: |
          valor="$(node scripts/inventario/mudou-conteudo.mjs)"
          echo "valor=$valor" >> "$GITHUB_OUTPUT"
          if [ "$valor" != "true" ]; then
            echo "Inventário sem mudança de conteúdo — nenhum PR a abrir."
          fi

      - name: Abrir ou atualizar PR do inventário
        id: pull-request
        if: steps.mudou.outputs.valor == 'true'
        uses: peter-evans/create-pull-request@v8
        env:
          HUSKY: '0' # Evita que hook do Husky bloqueie o push interno da action
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/inventario-estado
          delete-branch: true
          commit-message: 'chore: inventario do estado real [auto]'
          title: 'chore: inventário do estado real (semanal)'
          body: |
            Inventário refeito automaticamente por `.github/workflows/inventario-estado-semanal.yml`:
            banco oficial (somente leitura, Management API) + código. Só arquivos em `inventario/estado/`.

            - main de origem: `${{ github.sha }}`
            - run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: inventario
          add-paths: |
            inventario/estado/banco.json
            inventario/estado/rotas.json
            inventario/estado/edges.json

      # PR aberto com GITHUB_TOKEN não dispara workflows: os checks nascem em action_required.
      - name: Destravar os checks do PR do inventário
        if: steps.pull-request.outputs.pull-request-number != ''
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        with:
          script: |
            const headSha = process.env.PR_HEAD_SHA;
            if (!headSha) {
              core.warning('create-pull-request nao devolveu o head sha; nada a destravar.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let pendentes = [];
            for (let tentativa = 1; tentativa <= 6; tentativa += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: headSha,
                head_branch: 'automation/inventario-estado',
                status: 'action_required',
                per_page: 20,
              });
              pendentes = data.workflow_runs || [];
              if (pendentes.length > 0) break;
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            const liberados = [];
            const recusados = [];
            for (const run of pendentes) {
              try {
                await github.rest.actions.approveWorkflowRun({ owner, repo, run_id: run.id });
                liberados.push(run.name);
              } catch (error) {
                recusados.push(`${run.name} (${error.status})`);
              }
            }
            await core.summary.addRaw([
              '### Checks do PR do inventário',
              `- head sha: \`${headSha}\``,
              `- liberados: ${liberados.length > 0 ? liberados.join(', ') : 'nenhum'}`,
              ...(recusados.length > 0 ? [`- recusados: ${recusados.join(', ')} — aprovar na aba Actions`] : []),
            ].join('\n')).write();

      - name: Habilitar auto-merge no PR do inventário
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: |
          # O repo não tem auto-merge habilitado hoje (allow_auto_merge=false, ver
          # docs/agentes/github-ci.md) e `gh pr merge --auto` falha nesse caso — sem
          # continue-on-error isso ficaria vermelho toda semana por um pré-requisito que só o
          # dono liga nas Settings. Em vez de mascarar com continue-on-error (que também
          # esconderia uma falha de API real), trata exatamente esse erro conhecido como aviso
          # e deixa qualquer outro tipo de falha vermelha de verdade.
          if ! saida="$(gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" 2>&1)"; then
            if echo "$saida" | grep -qi "auto-merge is not allowed\|auto_merge_disabled\|AutoMerge"; then
              echo "::warning::Auto-merge não habilitado no repositório (allow_auto_merge=false) — PR #$PR_NUMBER fica aberto para merge manual."
            else
              echo "$saida" >&2
              exit 1
            fi
          fi

      - name: Upload do inventário
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inventario-estado-${{ github.run_id }}
          path: inventario/estado/
          retention-days: 14
