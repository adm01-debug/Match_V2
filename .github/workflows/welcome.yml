name: Welcome
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Obrigado por abrir esta issue! Nossa equipe irá analisar em breve.'
          pr-message: 'Obrigado pelo PR! Nossa equipe irá revisar em breve.'
